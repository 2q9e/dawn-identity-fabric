plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

def moduleProperties = new Properties()
file('gradle.properties').withInputStream { moduleProperties.load(it) }
moduleProperties.each { key, value -> project.ext.set(key.toString(), value.toString()) }

version = mod_version
group = maven_group

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.test.java.srcDir(rootProject.file('common/src/test/java'))

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
}

test {
    useJUnitPlatform()
}
