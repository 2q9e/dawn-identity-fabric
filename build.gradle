plugins {
    id 'base'
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Runs the unit tests for every Minecraft version module.'
    dependsOn(subprojects.collect { "${it.path}:test" })
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs all version-module unit tests.'
    dependsOn('testAll')
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every Minecraft version module.'
    dependsOn(subprojects.collect { "${it.path}:build" })
}

tasks.register('cleanAll') {
    group = 'build'
    description = 'Cleans every Minecraft version module.'
    dependsOn(subprojects.collect { "${it.path}:clean" })
}

tasks.named('check') {
    dependsOn('testAll')
}

tasks.named('build') {
    dependsOn('buildAll')
}

tasks.named('clean') {
    dependsOn('cleanAll')
}